services:
  kafka-1:
    image: bitnami/kafka:4.0.0
    container_name: kafka-1
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-id-001
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9094,2@kafka-2:9095
    ports:
      - "9092:9092"  # الخارجي:الداخلي
    networks:
      - kafka-new-net

  kafka-2:
    image: bitnami/kafka:4.0.0
    container_name: kafka-2
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-id-001
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:9095
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9094,2@kafka-2:9095
    ports:
      - "9093:9093"  # الخارجي:الداخلي
    networks:
      - kafka-new-net

networks:
  kafka-new-net:
    name: kafka-new-net
